[package]
name        = "apocrypha-desktop"
description = "Apocrypha desktop client · Windows · thin account client over the public apocky.com mobile contract"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
authors     = ["Apocky <apocky13@gmail.com>"]
publish     = false

# § STANDALONE crate. Deliberately NOT a member of the compiler-rs workspace:
#   the Tauri runtime pulls 200+ transitive deps and must never enter the
#   default `cargo build` of the CSSLv3 compiler workspace.
# § PRIME-DIRECTIVE : no telemetry · no analytics · no third-party call-path.
#   Every outbound request is checked against protocol::endpoint's allowlist.

[[bin]]
name = "apocrypha-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = [] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ureq       = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
url        = "2"
uuid       = { version = "1", features = ["v4"] }
base64     = "0.22"
thiserror  = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[profile.release]
opt-level = "s"
lto       = true
strip     = true
panic     = "abort"
