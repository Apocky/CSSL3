<text x="112" y="1228" fill="#69c2bb" font-family="Georgia, DejaVu Serif, serif" font-size="24" font-weight="normal" text-anchor="start">24 named faces  ·  8 × 8 × 8 = 512 ordered triples</text>
<text x="112" y="1272" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Fairness and independence are test assumptions only.</text>
<rect x="1115" y="1090" width="1005" height="242" rx="12" fill="#192531" stroke="#657784" stroke-width="2"/>
<text x="1147" y="1134" fill="#dfb96d" font-family="Georgia, DejaVu Serif, serif" font-size="26" font-weight="normal" text-anchor="start">CULTIVATION  /  TWO RETAINED VOCABULARIES</text>
<text x="1147" y="1182" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Codex: Spark → Kindling → Flame → Blaze → Conflagration → Sun →</text>
<text x="1147" y="1212" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Constellation</text>
<text x="1147" y="1254" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">V2: Spark-Touched → Flame-Kindled → Triple-Cast → Axis-Walker →</text>
<text x="1147" y="1284" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Labyrinth-Weaver → Oracle → Crown</text>
<line x1="80" y1="1377" x2="125" y2="1377" stroke="#dfb96d" stroke-width="3"/>
<text x="140" y="1385" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="20" font-weight="normal" text-anchor="start">Approved frame</text>
