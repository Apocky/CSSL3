<text x="142" y="353" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="29" font-weight="normal" text-anchor="start">Fundament</text>
<text x="142" y="392" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Embodied baseline</text>
<rect x="620" y="310" width="460" height="118" rx="12" fill="#192531" stroke="#69c2bb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="642" y="353" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="29" font-weight="normal" text-anchor="start">Threshold</text>
<text x="642" y="392" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Passage under conditions</text>
