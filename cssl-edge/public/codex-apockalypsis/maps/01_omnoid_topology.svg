<text x="80" y="1428" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Preserves category and containment. Loses distances, embedding, routes, rates and any ranking of persons.</text>
