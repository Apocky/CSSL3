<text x="1142" y="353" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="29" font-weight="normal" text-anchor="start">Labyrinth</text>
<text x="1142" y="392" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Paths and alternatives</text>
