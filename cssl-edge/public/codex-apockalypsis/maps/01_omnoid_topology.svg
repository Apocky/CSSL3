<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1460" viewBox="0 0 2200 1460" role="img" aria-labelledby="title desc">
<title id="title">The Omnoid and the names of passage</title><desc id="desc">Conceptual topology. The approved Omnoid contains candidate realms. Dashed relations are proposals. Gate functions, cultivation ladders and HALO symbols are separate categories. Position and size do not encode scientific geometry, power or moral worth.</desc>
<rect width="2200" height="1460" fill="#101822"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69c2bb"/></marker></defs>
<text x="80" y="88" fill="#dfb96d" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="normal" text-anchor="start">THE OMNOID AND THE NAMES OF PASSAGE</text>
<text x="80" y="130" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="24" font-weight="normal" text-anchor="start">A relation atlas · approved frame, proposed local arrangements</text>
<rect x="80" y="175" width="2040" height="555" rx="12" fill="#192531" stroke="#dfb96d" stroke-width="2"/>
<text x="115" y="220" fill="#dfb96d" font-family="Georgia, DejaVu Serif, serif" font-size="30" font-weight="normal" text-anchor="start">OMNOID  /  THE LARGER FRAME</text>
<text x="115" y="260" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="normal" text-anchor="start">Contains worlds and their histories; not a static doughnut, numbered heaven or proof of physical geometry.</text>
