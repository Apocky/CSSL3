<text x="642" y="547" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Relations and obligations</text>
<rect x="1120" y="465" width="460" height="118" rx="12" fill="#192531" stroke="#69c2bb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1142" y="508" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="29" font-weight="normal" text-anchor="start">Sight</text>
<text x="1142" y="547" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Perception with limits</text>
<rect x="1620" y="465" width="460" height="118" rx="12" fill="#192531" stroke="#69c2bb" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1642" y="508" fill="#f2ead9" font-family="Georgia, DejaVu Serif, serif" font-size="29" font-weight="normal" text-anchor="start">Crown</text>
<text x="1642" y="547" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="21" font-weight="normal" text-anchor="start">Scale without moral rank</text>
<text x="120" y="678" fill="#b4c1ca" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="normal" text-anchor="start">Candidate realm geography. Earth ↔ Fundament and Eden’s embedding remain unestablished.</text>
<line x1="330" y1="730" x2="330" y2="782" stroke="#69c2bb" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="365" y="773" fill="#69c2bb" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="normal" text-anchor="start">Access is conditional; the drawing asserts no automatic adjacency.</text>
