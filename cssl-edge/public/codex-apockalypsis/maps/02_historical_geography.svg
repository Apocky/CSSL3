<title id="title">Historical places and changing routes</title><desc id="desc">An era-aware schematic locator for the eastern Mediterranean and Mesopotamia. Coarse editorial coordinates show approximate places. Dashed lines are directions or disputed routes, never surveyed roads. Different periods are separated in the legend; global comparison lanes are named without inventing diffusion routes.</desc>
